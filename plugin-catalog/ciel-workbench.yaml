description: The Ciel desktop app in your browser. `ciel workbench` serves the desktop interface through the Ciel dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `ciel workbench` run and again after each Ciel update it runs `npm install --ignore-scripts` (guided by Ciel's lockfile) and Vite against your Ciel checkout's desktop sources, writing only under ~/.ciel/ciel-workbench and its own plugin dir (the checkout is only read), and starts `ciel dashboard` on loopback when none is running.
