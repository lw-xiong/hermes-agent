description: "Track subscription quotas and reset times in Ciel Desktop. Disclosure — probe.py re-executes itself under the Ciel Python interpreter located via CIEL_PYTHON / VIRTUAL_ENV / the parent process or the Ciel installer's managed venv (CIEL_HOME/installs); it reads provider API keys from the Ciel .env, Ciel's own saved OAuth logins (auth.json credential pool, read-only), the Vaultwarden plugin's local secret cache (cache/vaultwarden_cache.json, read-only, only when Vaultwarden is the sole enabled secret source) and Docker s6 container env files, plus other coding-assistant CLIs' local logins (including macOS keychain entries), and sends each key only to its own vendor's usage endpoint."
